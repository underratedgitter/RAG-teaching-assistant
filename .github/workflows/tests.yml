name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # The tests exercise chunking, caching, batch ordering and device
      # selection by reading the source directly, so faster-whisper — the
      # one heavy dependency left — is not installed here.
      - name: Install test dependencies
        run: pip install pytest joblib numpy pandas requests ruff

      # The scripts are mostly exercised end to end against Ollama and
      # ffmpeg, which CI does not have, so pyflakes is the net for names that
      # only break at runtime (a refactor once left `star`, `ou` and
      # `chunk_coun` behind and every test still passed).
      - name: Check for undefined names and other pyflakes errors
        run: ruff check . --select F

      - name: Run tests
        run: pytest tests/ -q
