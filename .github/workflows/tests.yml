name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # The chunking tests import merge_segments directly and need no heavy
      # dependencies — torch and whisper are not installed here.
      # The tests exercise chunking, caching and batch ordering directly.
      # torch and whisper are heavy and not needed for any of them.
      - name: Install test dependencies
        run: pip install pytest joblib numpy pandas requests

      - name: Run tests
        run: pytest tests/ -q
