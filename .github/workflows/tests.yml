name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # The tests exercise chunking, caching, batch ordering and device
      # selection by reading the source directly, so faster-whisper — the
      # one heavy dependency left — is not installed here.
      - name: Install test dependencies
        run: pip install pytest joblib numpy pandas requests

      - name: Run tests
        run: pytest tests/ -q
